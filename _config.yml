# Site settings
title: "Pablo Busch"
title_separator: "-"
name: "Pablo Busch"
description: "Assistant Professor at Pontificia Universidad Católica de Chile. Quantitative research on energy transition minerals, circular economy, environmental health, and decarbonization."
url: "https://pmbusch.github.io" # no trailing slash; overridden automatically if a CNAME is added later
baseurl: ""
repository: "pmbusch/pmbusch.github.io"
lang: "en"

# Default social preview image (Open Graph / Twitter)
logo: "/images/avatar.jpg"
image: "/images/avatar.jpg"

# Reading
exclude:
  - Gemfile
  - Gemfile.lock
  - Dockerfile
  - docker-compose.yaml
  - README.md
  - LICENSE
  - node_modules
  - TAKEAWAYS_REVIEW.md
  - .devcontainer
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true

# Plugins allowed on GitHub Pages
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# Google Analytics (GA4). Set to blank/remove to disable the tracking snippet.
google_analytics: "G-6ET5BV7C1L"

# jekyll-seo-tag defaults
twitter:
  card: summary_large_image
social:
  name: "Pablo Busch"
  links:
    - "https://scholar.google.cl/citations?user=1klIiDgAAAAJ&hl=es&oi=ao"
    - "https://orcid.org/0000-0002-9069-1401"
    - "https://github.com/pmbusch"
    - "https://www.linkedin.com/in/pmbusch/"

# Outputting
permalink: /:title/

defaults:
  - scope:
      path: ""
    values:
      layout: "default"
